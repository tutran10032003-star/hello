<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anh Tú</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #16181d;
    --muted: #5d6470;
    --accent: #1f6feb;
    --border: #e3e1da;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a21;
      --text: #f2f3f5;
      --muted: #9aa1ad;
      --accent: #6aa5ff;
      --border: #272b35;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.25rem, env(safe-area-inset-bottom));
    min-height: 100dvh;
  }

  main {
    width: 100%;
    max-width: 32rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1.5rem;
    padding: 2rem 1.5rem;
  }

  .date {
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  h1 {
    font-size: clamp(2.5rem, 12vw, 3.75rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-weight: 700;
  }

  .role {
    margin-top: 0.75rem;
    font-size: 1.05rem;
    color: var(--accent);
    font-weight: 500;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 1.75rem 0;
  }

  .label {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  p.problem {
    font-size: 1.05rem;
    color: var(--text);
  }

  @media (min-width: 600px) {
    main { padding: 3rem 2.5rem; }
  }
</style>
</head>
<body>
  <main>
    <div class="date" id="date"></div>

    <h1>Anh Tú</h1>
    <p class="role">MSc student, National College of Ireland</p>

    <hr>

    <div class="label">A problem I care about</div>
    <p class="problem">
      I care about how businesses turn messy data into decisions people actually act on,
      especially when customers say one thing but buy another.
    </p>
  </main>

  <script>
    (function () {
      var el = document.getElementById("date");
      var now = new Date();
      try {
        el.textContent = now.toLocaleDateString("en-IE", {
          weekday: "long", day: "numeric", month: "long", year: "numeric"
        });
      } catch (e) {
        el.textContent = now.toDateString();
      }
    })();
  </script>
</body>
</html>
